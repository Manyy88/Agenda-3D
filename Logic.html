<script>
const Radar = (() => {
  function date(s) { return new Date(s + 'T12:00:00Z'); }
  function iso(d) { return d.toISOString().slice(0,10); }
  function days(today) {
    const d = date(today), result = [];
    while(result.length < 3) { d.setUTCDate(d.getUTCDate()+1); if(d.getUTCDay() !== 0) result.push(iso(d)); }
    return result;
  }
  function operating(month) {
    const d = date(month+'-01'); let n=0;
    while(iso(d).slice(0,7) === month) { if(d.getUTCDay()!==0) n++; d.setUTCDate(d.getUTCDate()+1); }
    return n;
  }
  function integer(value, min=0) {
    if(value === '' || value === null || value === undefined || typeof value === 'boolean') return null;
    const n=Number(value); return Number.isSafeInteger(n) && n>=min && n<=1000000 ? n : null;
  }
  function calculate(today, goals, apv, agendas) {
    const count=integer(apv,1);
    return days(today).map((day,i)=>{
      const month=day.slice(0,7), sales=integer(goals[month]), operatingDays=operating(month);
      const target=sales===null?null:Math.ceil(sales*8/operatingDays);
      const scheduled=integer(agendas[i]);
      return {day,month,sales,operatingDays,monthlyAppointments:sales===null?null:sales*8,target,perApv:target===null||count===null?null:target/count,scheduled,gap:target===null||scheduled===null?null:scheduled-target};
    });
  }
  return {days,operating,integer,calculate};
})();
</script>
